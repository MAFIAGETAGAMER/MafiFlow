
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MafiFlow --icon "assets/MafiFlow.ico" --add-data "assets;assets" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MafiFlow-1.3.2-Windows
          path: dist/MafiFlow.exe
          if-no-files-found: error
