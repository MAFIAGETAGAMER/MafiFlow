name: Build MafiFlow Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check source and branding assets
        run: python tools/check_source.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Windows runner and install dependencies
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Windows setup failed' }
          & ./tools/Preparar-Windows.ps1
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'analyze failed' }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
      - name: Apply branding and build Windows
        run: |
          & ./tools/Branding-Windows.ps1
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & ./tools/Verificar-Icono-Exe.ps1
      - name: Upload complete Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MafiFlow-Windows-1.5.12-28
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
